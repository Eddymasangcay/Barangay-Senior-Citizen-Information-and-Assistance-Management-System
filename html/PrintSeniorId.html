<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3D007A">
  <title>Print Senior Citizen ID | BSCIAMS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #F6F2FA;
      color: #1E1A24;
      font-family: Inter, Arial, sans-serif;
    }
    .print-toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      padding: 12px 16px;
      background: #3D007A;
      color: #fff;
    }
    .print-toolbar p {
      margin: 0;
      flex: 1 1 180px;
      font-size: 13px;
      line-height: 1.4;
      opacity: 0.92;
    }
    .print-toolbar__actions { display: flex; gap: 8px; }
    .print-toolbar button {
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font: 600 14px/1 Inter, Arial, sans-serif;
      cursor: pointer;
    }
    #backBtn { background: rgba(255,255,255,0.14); color: #fff; }
    #printBtn { background: #fff; color: #3D007A; }
    .print-empty {
      max-width: 32rem;
      margin: 48px auto;
      padding: 0 20px;
      text-align: center;
    }
    .print-empty a { color: #3D007A; font-weight: 600; }
    .id-sheet {
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    .id-card {
      box-sizing: border-box;
      display: grid;
      grid-template-rows: 11mm 1fr 7mm;
      width: 85.6mm;
      height: 53.98mm;
      overflow: hidden;
      color: #1E1A24;
      background: #fff;
      border: 0.3mm solid #3D007A;
      box-shadow: 0 10px 28px rgba(61, 0, 122, 0.16);
      font-size: 7.2pt;
      line-height: 1.25;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .id-card *, .id-card *::before, .id-card *::after { box-sizing: border-box; }
    .id-card__banner {
      display: grid;
      grid-template-columns: 9mm 1fr auto;
      align-items: center;
      gap: 2mm;
      padding: 0 2.8mm;
      background: #3D007A;
      color: #fff;
    }
    .id-card__seal {
      display: grid;
      place-items: center;
      width: 8mm;
      height: 8mm;
      border: 0.35mm solid rgba(255,255,255,0.85);
      border-radius: 50%;
      background: #2E005C;
      font-size: 4.2mm;
    }
    .id-card__kicker {
      display: block;
      font-size: 5.4pt;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.86;
    }
    .id-card__title { display: block; font-size: 8pt; font-weight: 700; }
    .id-card__ra { font-size: 5.2pt; font-weight: 600; text-transform: uppercase; }
    .id-card__body {
      display: grid;
      grid-template-columns: 18.5mm 1fr 16.5mm;
      gap: 2.2mm;
      padding: 2.2mm 2.8mm 1.6mm;
      min-height: 0;
    }
    .id-card__photo {
      display: grid;
      place-items: center;
      width: 18.5mm;
      height: 23.5mm;
      overflow: hidden;
      border: 0.25mm solid #C9C2D2;
      background: #F4EEFA;
      color: #3D007A;
      font-size: 7mm;
      font-weight: 700;
    }
    .id-card__photo img { width: 18.5mm; height: 23.5mm; object-fit: cover; display: block; }
    .id-card__name { margin: 0 0 1.2mm; font-size: 8pt; font-weight: 700; text-transform: uppercase; }
    .id-card__dl { margin: 0; }
    .id-card__dl div { display: grid; grid-template-columns: 16mm 1fr; gap: 1mm; margin: 0 0 0.55mm; }
    .id-card__dl dt { margin: 0; color: #6B6575; font-size: 5.6pt; font-weight: 600; text-transform: uppercase; }
    .id-card__dl dd { margin: 0; font-weight: 600; font-size: 7.2pt; }
    .id-card__number {
      display: inline-block;
      margin-top: 0.6mm;
      padding: 0.4mm 1.4mm;
      border-radius: 0.8mm;
      background: #F4EEFA;
      color: #3D007A;
      font-weight: 700;
    }
    .id-card__codes { display: flex; flex-direction: column; justify-content: space-between; }
    .id-card__qr {
      width: 16.5mm;
      height: 16.5mm;
      border: 0.25mm solid #1E1A24;
      background: repeating-conic-gradient(#1E1A24 0 25%, #fff 0 50%) 0 0 / 1.7mm 1.7mm;
    }
    .id-card__barcode {
      height: 6.4mm;
      background: repeating-linear-gradient(90deg, #1E1A24 0 0.45mm, #fff 0.45mm 0.7mm, #1E1A24 0.7mm 0.95mm, #fff 0.95mm 1.35mm);
    }
    .id-card__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2.8mm;
      background: #EFECF1;
      color: #3D007A;
      font-size: 5.4pt;
      font-weight: 600;
      text-transform: uppercase;
    }
    .id-card--scan { display: block; padding: 0; grid-template-rows: none; }
    .id-card__scan {
      width: 85.6mm;
      height: 53.98mm;
      max-width: 85.6mm;
      max-height: 53.98mm;
      object-fit: contain;
      object-position: center;
      display: block;
      background: #fff;
    }
    @page { margin: 8mm; }
    @media print {
      html, body { background: #fff; }
      .print-toolbar,
      .print-empty { display: none !important; }
      .id-sheet {
        padding: 0;
        min-height: 0;
        break-inside: avoid;
        page-break-inside: avoid;
        page-break-after: always;
        break-after: page;
      }
      .id-sheet:last-child {
        page-break-after: auto;
        break-after: auto;
      }
      .id-card { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="print-toolbar">
    <div class="print-toolbar__actions">
      <button type="button" id="backBtn">Back</button>
      <button type="button" id="printBtn">Print ID</button>
    </div>
    <p>This page prints only the ID card at CR80 size (85.6 × 54 mm). Use Letter or ID-card paper — the card stays actual size.</p>
  </div>
  <main id="sheets"></main>
  <p class="print-empty" id="empty" hidden>
    No ID is ready to print. <a href="/SeniorRegistry">Return to Senior Registry</a>
  </p>
  <script>
    (function () {
      const KEY = 'bscims.idPrint';
      const sheets = document.getElementById('sheets');
      const empty = document.getElementById('empty');
      const markup = sessionStorage.getItem(KEY) || '';

      document.getElementById('backBtn').onclick = function () {
        if (history.length > 1) history.back();
        else location.href = '/SeniorRegistry';
      };
      document.getElementById('printBtn').onclick = function () { window.print(); };

      if (!markup) {
        empty.hidden = false;
        document.getElementById('printBtn').disabled = true;
        return;
      }

      sheets.innerHTML = markup;
      const images = Array.prototype.slice.call(document.images);
      Promise.all(images.map(function (img) {
        return img.complete ? Promise.resolve() : new Promise(function (resolve) {
          img.onload = img.onerror = resolve;
        });
      })).then(function () {
        const mobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (!mobile) window.print();
      });
    }());
  </script>
</body>
</html>
